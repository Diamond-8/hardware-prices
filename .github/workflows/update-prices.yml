name: Update prices

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["products.yaml", "site/**", "scraper.py"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check links
        run: python check_links.py
        continue-on-error: true

      - name: Scrape prices
        run: python scraper.py

      - name: Save prices to repo
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add -A site state.json
          git diff --cached --quiet || git commit -m "update prices"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
